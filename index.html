<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Betreuung – Touch-Tabelle</title>

<link rel="manifest" href="manifest.webmanifest">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f8;
  color:#263238;
}

header{
  background:#6b8e9e;
  color:white;
  padding:14px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

nav{
  display:flex;
  gap:6px;
  padding:8px;
  background:white;
  position:sticky;
  top:0;
  z-index:10;
  overflow-x:auto;
}

nav button{
  flex:1;
  min-width:110px;
  padding:14px 8px;
  border:0;
  border-radius:10px;
  background:#dce5e9;
  font-size:16px;
}

nav button.active{
  background:#6b8e9e;
  color:white;
}

main{
  padding:12px;
  max-width:1000px;
  margin:auto;
}

h2{
  margin-top:8px;
}

.section{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:14px;
  box-shadow:0 1px 4px #0001;
}

.datebar{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

input[type=date]{
  font-size:18px;
  padding:10px;
  border-radius:9px;
  border:1px solid #bbb;
}

button{
  cursor:pointer;
}

.smallbtn{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  background:#dce5e9;
  font-size:15px;
}

.child{
  background:#fafafa;
  border-left:7px solid #ccc;
  border-radius:10px;
  padding:10px;
  margin:8px 0;
}

.childtitle{
  font-weight:bold;
  margin-bottom:8px;
}

.controls{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  align-items:center;
}

select{
  font-size:17px;
  padding:9px;
  border-radius:8px;
  border:1px solid #bbb;
  background:white;
}

.planned{
  background:#fff4b8;
}

.exception{
  border:3px solid #e67e22;
background:#fff0e0;
}

.regular-row{
  display:grid;
  grid-template-columns:120px repeat(5,1fr);
  gap:6px;
  align-items:center;
  margin:5px 0;
}

.regular-row select{
  width:100%;
  font-size:14px;
  padding:7px;
}

.regular-head{
  display:grid;
  grid-template-columns:120px repeat(5,1fr);
  gap:6px;
  font-weight:bold;
  margin-bottom:5px;
}

.daybox{
  background:#f5f7f8;
  border-radius:8px;
  padding:4px;
}

.going{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px;
  border-radius:9px;
  margin:5px 0;
}

.time{
  font-size:21px;
  font-weight:bold;
  min-width:65px;
}

.type{
  font-size:17px;
}

.classname{
  font-size:12px;
  opacity:.7;
}

.notice{
  background:#eef5f7;
  padding:10px;
  border-radius:9px;
  margin:8px 0;
}

@media(max-width:700px){
  .regular-row,
  .regular-head{
    grid-template-columns:80px repeat(5,1fr);
  }

  .regular-row select{
    font-size:12px;
  }
}
.week-controls{
  margin:12px 0 18px;
}

.week-controls input{
  font-size:18px;
  padding:8px;
  margin-left:8px;
}

.weekly-title{
  font-size:22px;
  font-weight:700;
  margin-bottom:2px;
}

.weekly-subtitle{
  font-size:16px;
  margin-bottom:12px;
}

.weekly-table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  font-size:13px;
}

.weekly-table th,
.weekly-table td{
  padding:4px 3px;
  text-align:center;
  border-bottom:1px solid #d8d8d8;
}

.weekly-table .child-col{
  width:24%;
  text-align:left;
}

.weekly-table .day-col{
  font-weight:700;
}

.weekly-table .day-col span{
  font-weight:400;
  font-size:11px;
}

.weekly-table .child-name{
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
}

.weekly-table .day-start{
  border-left:2px solid #777;
}

.weekly-table .subhead th{
  font-size:11px;
  font-weight:600;
}

.weekly-table .class-row td{
  text-align:left;
  font-weight:700;
  padding-top:8px;
  padding-bottom:3px;
  border-bottom:1px solid #999;
}

@media print{
  body{
    background:white;
  }

  nav,
  .week-controls,
  #heute,
  #alle,
  #wochenplanung,
  #wergeht{
    display:none !important;
  }

  #wochenuebersicht{
    display:block !important;
  }

  .weekly-table{
    font-size:11px;
  }

  .weekly-table th,
  .weekly-table td{
    padding:3px 2px;
  }

  @page{
    size:A4 portrait;
    margin:10mm;
  }
}</style>
</head>

<body>

<header>Betreuung – Touch-Tabelle</header>

<nav>
  <button id="tab-heute" onclick="showTab('heute')">Heute</button>
  <button id="tab-alle" onclick="showTab('alle')">Alle Kinder</button>
  <button id="tab-woche" onclick="showTab('woche')">Wochenplanung</button>
  <button id="tab-geht" onclick="showTab('geht')">Wer geht heute?</button>
<button class="tab" onclick="showTab('wochenuebersicht')">Wochenübersicht</button></nav>

<main>
<section id="wochenuebersicht" class="view">
  <h2>Wochenübersicht</h2>

  <div class="week-controls">
    <label>
      Woche:
      <input
        type="date"
        id="weekPicker"
        onchange="renderWeeklyOverview()"
      >
    </label>
  </div>

  <div id="weeklyOverview"></div>
</section>
<section id="heute" class="view">
  <h2>Heute</h2>
  <div id="todayList"></div>
</section>

<section id="alle" class="view" style="display:none">
  <h2>Alle Kinder</h2>
  <div id="allList"></div>
</section>

<section id="woche" class="view" style="display:none">

  <h2>Wochenplanung</h2>

  <div class="section">
    <div class="datebar">
      <strong>Datum:</strong>
      <input type="date" id="selectedDate" onchange="renderDailyPlan()">
      <button class="smallbtn" onclick="goToday()">Heute</button>
      <button class="smallbtn" onclick="showRegular()">Regelmäßige Woche</button>
    </div>

    <div id="dateInfo" class="notice"></div>
  </div>

  <div id="dailyPlanning"></div>

  <div id="regularPlanning" style="display:none"></div>

</section>

<section id="geht" class="view" style="display:none">
  <h2>Wer geht heute?</h2>
  <div id="goingList"></div>
</section>

</main>

<script>

const classes = [
  ["Klasse 1 Affen","blau",9],
  ["Klasse 1 Zebra","blau",6],
  ["Klasse 2 Affen","grün",11],
  ["Klasse 2 Zebra","grün",13],
  ["Klasse 3","gelb",12],
  ["Klasse 4","rot",16]
];

const children=[];
let number=1;

classes.forEach(c=>{
  for(let i=0;i<c[2];i++){
    children.push({
      id:"kind"+number,
      name:"Kind "+number,
      className:c[0],
      color:c[1]
    });
    number++;
  }
});

const times=[
  "",
  "11:00",
  "12:00",
  "12:45",
  "13:00",
  "13:10",
  "13:45",
  "14:00",
  "14:30",
  "14:35",
  "15:00",
  "15:30",
  "16:00"
];

const types=["","B","•","Pp","H","A"];

const weekdayNames=[
  "Sonntag",
  "Montag",
  "Dienstag",
  "Mittwoch",
  "Donnerstag",
  "Freitag",
  "Samstag"
];

/* -------------------------
   SPEICHER
------------------------- */

function load(key, fallback){
  try{
    const x=localStorage.getItem(key);
    return x ? JSON.parse(x) : fallback;
  }catch(e){
    return fallback;
  }
}

function save(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}

let attendance=load("attendance",{});
let dailyPlans=load("dailyPlans",{});
let regularPlans=load("regularPlans",{});

/*
  Falls eine ältere Version bereits "actuals" benutzt hat,
  werden die Daten übernommen.
*/
if(Object.keys(attendance).length===0){
  const old=load("actuals",{});
  if(Object.keys(old).length){
    attendance=old;
    save("attendance",attendance);
  }
}

/* -------------------------
   HILFSFUNKTIONEN
------------------------- */

function todayString(){
  const d=new Date();
  return d.toISOString().slice(0,10);
}

function formatDate(date){
  const d=new Date(date+"T12:00:00");
  return d.toLocaleDateString("de-DE",{
    weekday:"long",
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}

function weekday(date){
  return new Date(date+"T12:00:00").getDay();
}

function childColor(c){
  const map={
    blau:"#8faec0",
    grün:"#9dbb9d",
    gelb:"#d5bd67",
    rot:"#c98f8f"
  };
  return map[c.color] || "#ccc";
}

function options(list,selected){
  return list.map(x=>{
    const value=x;
    const text=x || "keine Planung";
    return `<option value="${value}" ${value===selected?"selected":""}>${text}</option>`;
  }).join("");
}

function typeOptions(selected){
  return types.map(x=>{
    const text=x || "–";
    return `<option value="${x}" ${x===selected?"selected":""}>${text}</option>`;
  }).join("");
}

/* -------------------------
   PLANUNG ERMITTELN
------------------------- */

function getRegularPlan(childId,date){
  const wd=weekday(date);

  if(wd===0 || wd===6) return {
    time:"",
    type:""
  };

  return (
    regularPlans[childId] &&
    regularPlans[childId][wd]
  ) || {
    time:"",
    type:""
  };
}

function getPlan(childId,date){
  if(
    dailyPlans[date] &&
    dailyPlans[date][childId]
  ){
    return {
      ...dailyPlans[date][childId],
      exception:true
    };
  }

  return {
    ...getRegularPlan(childId,date),
    exception:false
  };
}

/* -------------------------
   TABS
------------------------- */

function showTab(tab){

  document.querySelectorAll(".view").forEach(x=>{
    x.style.display="none";
  });

  document.querySelectorAll("nav button").forEach(x=>{
    x.classList.remove("active");
  });

  document.getElementById(tab).style.display="block";
  document.getElementById("tab-"+tab).classList.add("active");
  if(tab==="wochenuebersicht")renderWeeklyOverview();
  if(tab==="heute") renderToday();
  if(tab==="alle") renderAll();
  if(tab==="woche") renderDailyPlan();
  if(tab==="geht") renderGoing();
  if(tab==="wochenuebersicht"){const p=document.getElementById("weekPicker");if(p&&!p.value)p.value=todayString();renderWeeklyOverview()}
  }
/* -------------------------
   HEUTE
------------------------- */

function renderToday(){

  const date=todayString();

  let html="";

  children.forEach(c=>{

    const a=attendance[date]?.[c.id] || {};

    html+=`
      <div class="child"
           style="border-left-color:${childColor(c)}">

        <div class="childtitle">
          ${c.name}
          <span class="classname">${c.className}</span>
        </div>

        <div class="controls">

          <button class="smallbtn"
            onclick="setArrival('${c.id}')">
            ${a.ankommen ? "Ankommen "+a.ankommen : "Ankommen"}
          </button>

          <button class="smallbtn"
            onclick="setDeparture('${c.id}')">
            ${a.gehen ? "Gehen "+a.gehen : "Gehen"}
          </button>

        </div>
      </div>
    `;
  });

  document.getElementById("todayList").innerHTML=html;
}

function currentTime(){
  return new Date().toLocaleTimeString("de-DE",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function setArrival(id){

  const date=todayString();

  if(!attendance[date]) attendance[date]={};

  attendance[date][id]=attendance[date][id] || {};

  attendance[date][id].ankommen=currentTime();

  save("attendance",attendance);

  renderToday();
}

function setDeparture(id){

  const date=todayString();

  if(!attendance[date]) attendance[date]={};

  attendance[date][id]=attendance[date][id] || {};

  attendance[date][id].gehen=currentTime();

  save("attendance",attendance);

  renderToday();
}

/* -------------------------
   ALLE KINDER
------------------------- */

function renderAll(){

  let html="";

  classes.forEach(c=>{

    html+=`
      <div class="section">
        <h3>${c[0]}</h3>
    `;

    children
      .filter(x=>x.className===c[0])
      .forEach(x=>{
        html+=`
          <div>${x.name}</div>
        `;
      });

    html+="</div>";
  });

  document.getElementById("allList").innerHTML=html;
}

/* -------------------------
   DATUM
------------------------- */

function goToday(){
  document.getElementById("selectedDate").value=todayString();
  renderDailyPlan();
}

/* -------------------------
   TAGESPLANUNG
------------------------- */

function renderDailyPlan(){

  const date=
    document.getElementById("selectedDate").value ||
    todayString();

  document.getElementById("selectedDate").value=date;

  document.getElementById("regularPlanning").style.display="none";
  document.getElementById("dailyPlanning").style.display="block";

  document.getElementById("dateInfo").innerHTML=
    `<strong>${formatDate(date)}</strong>
     – Tippe hier die Planung für genau diesen Tag ein.`;

  let html="";

  classes.forEach(cls=>{

    html+=`
      <div class="section">
        <h3>${cls[0]}</h3>
    `;

    children
      .filter(c=>c.className===cls[0])
      .forEach(c=>{

        const plan=getPlan(c.id,date);

        html+=`
          <div class="child
            ${plan.time ? "planned":""}
            ${plan.exception ? "exception":""}"
            style="border-left-color:${childColor(c)}">

            <div class="childtitle">
              ${c.name}
              ${plan.exception
                ? `<span class="classname">Ausnahme für diesen Tag</span>`
                : `<span class="classname">regelmäßige Planung</span>`
              }
            </div>

            <div class="controls">

              <select
                onchange="changeDailyPlan('${date}','${c.id}',this.value,null)">
                ${options(times,plan.time)}
              </select>

              <select
                onchange="changeDailyPlan('${date}','${c.id}',null,this.value)">
                ${typeOptions(plan.type)}
              </select>

              ${
                plan.exception
                ?
                `<button class="smallbtn"
                   onclick="useRegular('${date}','${c.id}')">
                   Regelmäßig verwenden
                 </button>`
                :
                ""
              }

            </div>

          </div>
        `;
      });

    html+="</div>";
  });

  document.getElementById("dailyPlanning").innerHTML=html;
}

function changeDailyPlan(date,id,time,type){

  if(!dailyPlans[date]){
    dailyPlans[date]={};
  }

  const old=dailyPlans[date][id] || getRegularPlan(id,date);

  dailyPlans[date][id]={
    time:time===null ? old.time : time,
    type:type===null ? old.type : type
  };

  save("dailyPlans",dailyPlans);

  renderDailyPlan();
}

function useRegular(date,id){

  if(dailyPlans[date]){
    delete dailyPlans[date][id];

    if(Object.keys(dailyPlans[date]).length===0){
      delete dailyPlans[date];
    }

    save("dailyPlans",dailyPlans);
  }

  renderDailyPlan();
}

/* -------------------------
   REGELMÄSSIGE WOCHE
------------------------- */

function showRegular(){

  document.getElementById("dailyPlanning").style.display="none";
  document.getElementById("regularPlanning").style.display="block";

  let html=`
    <div class="section">

      <h2>Regelmäßige Woche</h2>

      <div class="notice">
        Diese Planung gilt automatisch für alle zukünftigen
        entsprechenden Wochentage. Eine einzelne Tagesplanung
        kann sie jederzeit überschreiben.
      </div>

      <div class="regular-head">
        <div>Kind</div>
        <div>Mo</div>
        <div>Di</div>
        <div>Mi</div>
        <div>Do</div>
        <div>Fr</div>
      </div>
  `;

  classes.forEach(cls=>{

    html+=`<h3>${cls[0]}</h3>`;

    children
      .filter(c=>c.className===cls[0])
      .forEach(c=>{

        html+=`
          <div class="regular-row">

            <div>
              <strong>${c.name}</strong>
            </div>
        `;

        for(let wd=1;wd<=5;wd++){

          const p=
            regularPlans[c.id]?.[wd] ||
            {time:"",type:""};

          html+=`
            <div class="daybox">

              <select
                onchange="changeRegular('${c.id}',${wd},'time',this.value)">
                ${options(times,p.time)}
              </select>

              <select
                onchange="changeRegular('${c.id}',${wd},'type',this.value)">
                ${typeOptions(p.type)}
              </select>

            </div>
          `;
        }

        html+="</div>";
      });
  });

  html+=`
      </div>
  `;

  document.getElementById("regularPlanning").innerHTML=html;
}

function changeRegular(id,wd,field,value){

  if(!regularPlans[id]){
    regularPlans[id]={};
  }

  if(!regularPlans[id][wd]){
    regularPlans[id][wd]={
      time:"",
      type:""
    };
  }

  regularPlans[id][wd][field]=value;

  save("regularPlans",regularPlans);
}

/* -------------------------
   WER GEHT HEUTE?
------------------------- */

function renderGoing(){

  const date=todayString();

  const list=[];

  children.forEach(c=>{

    const p=getPlan(c.id,date);

    if(p.time){

      list.push({
        child:c,
        time:p.time,
        type:p.type
      });
    }
  });

  list.sort((a,b)=>
    a.time.localeCompare(b.time)
  );

  if(!list.length){

    document.getElementById("goingList").innerHTML=
      `<div class="notice">
        Für heute ist noch keine Abhol-/Gehplanung eingetragen.
      </div>`;

    return;
  }

  let html="";

  list.forEach(x=>{

    html+=`
      <div class="going"
        style="border-left:7px solid ${childColor(x.child)}">

        <div class="time">${x.time}</div>

        <div>
          <strong>${x.child.name}</strong>
          <div class="classname">${x.child.className}</div>
        </div>

        <div class="type">${x.type || ""}</div>

      </div>
    `;
  });

  document.getElementById("goingList").innerHTML=html;
}

/* -------------------------
   START
------------------------- */

document.getElementById("selectedDate").value=todayString();

showTab("heute");

/* Service Worker */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
/* -------------------------
   WOCHENÜBERSICHT
------------------------- */

function mondayOf(dateString){
  const d=new Date(dateString+"T12:00:00");
  const day=d.getDay();
  const diff=day===0 ? -6 : 1-day;
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}

function addDays(dateString,days){
  const d=new Date(dateString+"T12:00:00");
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}

function shortDate(dateString){
  const d=new Date(dateString+"T12:00:00");
  return d.toLocaleDateString("de-DE",{
    day:"2-digit",
    month:"2-digit"
  });
}

function renderWeeklyOverview(){

  const picker=document.getElementById("weekPicker");
  if(!picker) return;
if(!picker.value) picker.value=todayString();
  const monday=mondayOf(picker.value || todayString());
  picker.value=monday;

  const days=[
    addDays(monday,0),
    addDays(monday,1),
    addDays(monday,2),
    addDays(monday,3),
    addDays(monday,4)
  ];

  const names=["Mo","Di","Mi","Do","Fr"];

  let html=`
    <div class="weekly-print-area">

      <div class="weekly-title">
        Wochenübersicht
      </div>

      <div class="weekly-subtitle">
        ${shortDate(days[0])} – ${shortDate(days[4])}
      </div>

      <table class="weekly-table">

        <thead>
          <tr>
            <th class="child-col">Kind</th>
  `;

  days.forEach((day,i)=>{
    html+=`
      <th colspan="2" class="day-col ${i>0 ? "day-start":""}">
        ${names[i]}<br>
        <span>${shortDate(day)}</span>
      </th>
    `;
  });

  html+=`
          </tr>

          <tr class="subhead">
            <th></th>
  `;

  days.forEach((day,i)=>{
    html+=`
      <th class="${i>0 ? "day-start":""}">An</th>
      <th>Ab</th>
    `;
  });

  html+=`
          </tr>
        </thead>

        <tbody>
  `;

  classes.forEach(cls=>{

    html+=`
      <tr class="class-row">
        <td colspan="11">${cls[0]}</td>
      </tr>
    `;

    children
      .filter(c=>c.className===cls[0])
      .forEach(c=>{

        html+=`
          <tr>
            <td class="child-name">
              ${c.name}
            </td>
        `;

        days.forEach((day,i)=>{

          const a=attendance[day]?.[c.id] || {};

          html+=`
            <td class="${i>0 ? "day-start":""}">
              ${a.ankommen || "–"}
            </td>

            <td>
              ${a.gehen || "–"}
            </td>
          `;
        });

        html+=`</tr>`;
      });
  });

  html+=`
        </tbody>
      </table>

    </div>
  `;

  document.getElementById("weeklyOverview").innerHTML=html;
}
</script>

</body>
</html>
