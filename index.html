<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6b8e9e">
<link rel="manifest" href="manifest.webmanifest">
<title>Betreuung – Touch-Tabelle</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f8;
  color:#263238;
}

header{
  background:#6b8e9e;
  color:white;
  padding:18px;
  text-align:center;
}

h1{margin:0;font-size:28px}
h2{margin-top:0}

nav{
  display:flex;
  gap:8px;
  padding:10px;
  background:white;
  position:sticky;
  top:0;
  z-index:5;
  overflow-x:auto;
}

nav button{
  flex:1;
  min-width:110px;
  background:#dce7eb;
}

nav button.active{
  background:#6b8e9e;
  color:white;
}

main{
  padding:14px;
  max-width:1100px;
  margin:auto;
}

.card{
  background:white;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0001;
}

.child{
  display:grid;
  grid-template-columns:1fr 130px 130px;
  gap:8px;
  align-items:center;
  padding:10px;
  border-radius:12px;
  margin:6px 0;
}

.class1{border-left:12px solid #7aa7d9}
.class2{border-left:12px solid #75b77a}
.class3{border-left:12px solid #e2c34f}
.class4{border-left:12px solid #d96b62}

button,select{
  border:0;
  border-radius:12px;
  padding:12px;
  font-size:17px;
}

button{cursor:pointer}

.child button{
  background:#e8eef0;
}

.time{
  font-size:20px;
  font-weight:bold;
  text-align:center;
}

.planned{
  color:#888;
  font-weight:bold;
}

.small{
  font-size:14px;
  color:#667;
}

.hidden{display:none}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.controls button{
  background:#dce7eb;
}

.controls button.active{
  background:#6b8e9e;
  color:white;
}

.planrow{
  display:grid;
  grid-template-columns:1fr 150px 100px;
  gap:8px;
  align-items:center;
  padding:8px;
  border-radius:10px;
  margin:5px 0;
  background:#f7f9fa;
}

.planrow select{
  width:100%;
  background:white;
}

.planned-label{
  color:#888;
  font-size:13px;
}

.actual{
  color:#263238;
  font-weight:bold;
}

.override{
  background:#fff8df;
}

@media(max-width:700px){
  .child{
    grid-template-columns:1fr 105px 105px;
  }

  .child button{
    padding:11px 4px;
    font-size:15px;
  }

  .planrow{
    grid-template-columns:1fr 125px 85px;
  }

  .planrow select{
    font-size:15px;
    padding:10px 4px;
  }
}
</style>
</head>

<body>

<header>
<h1>Betreuung – Touch-Tabelle</h1>
<div id="date"></div>
</header>

<nav>
<button class="active" onclick="showPage('today',this)">Heute</button>
<button onclick="showPage('all',this)">Alle Kinder</button>
<button onclick="showPage('week',this)">Wochenplanung</button>
<button onclick="showPage('going',this)">Wer geht heute?</button>
</nav>

<main>

<section id="today"></section>

<section id="all" class="hidden"></section>

<section id="week" class="hidden"></section>

<section id="going" class="hidden"></section>

</main>

<script>

const classes=[
 ["Klasse 1 Affen","class1",9],
 ["Klasse 1 Zebra","class1",6],
 ["Klasse 2 Affen","class2",11],
 ["Klasse 2 Zebra","class2",13],
 ["Klasse 3","class3",12],
 ["Klasse 4","class4",16]
];

const children=[];
let number=1;

classes.forEach(c=>{
 for(let i=0;i<c[2];i++){
   children.push({
     id:number,
     name:"Kind "+(number+1),
     className:c[0],
     color:c[1]
   });
   number++;
 }
});

const times=[
 "11:00","12:00","12:45","13:00","13:10",
 "13:45","14:00","14:30","14:35","15:00",
 "15:30","16:00"
];

const types=[
 ["","—"],
 ["B","B"],
 ["•","•"],
 ["Pp","Pp"],
 ["H","H"],
 ["A","A"]
];

let selectedDate=new Date();

function dateKey(date){
 return date.toISOString().slice(0,10);
}

function todayKey(){
 return dateKey(new Date());
}

function actualKey(id,date=todayKey()){
 return "actual_"+id+"_"+date;
}

function planKey(id,date){
 return "plan_"+id+"_"+date;
}

function regularKey(id,weekday){
 return "regular_"+id+"_"+weekday;
}

function now(){
 return new Date().toLocaleTimeString("de-DE",{
   hour:"2-digit",
   minute:"2-digit"
 });
}

function saveActual(id,type){
 let key=actualKey(id);
 let data=JSON.parse(localStorage.getItem(key)||"{}");
 data[type]=now();
 localStorage.setItem(key,JSON.stringify(data));
 render();
}

function getActual(id,date=todayKey()){
 return JSON.parse(localStorage.getItem(actualKey(id,date))||"{}");
}

function getPlan(id,date){
 let key=planKey(id,date);
 let saved=localStorage.getItem(key);

 if(saved){
   return JSON.parse(saved);
 }

 let d=new Date(date+"T12:00:00");
 let weekday=d.getDay();

 let regular=localStorage.getItem(regularKey(id,weekday));

 if(regular){
   return JSON.parse(regular);
 }

 return {time:"",type:""};
}

function savePlan(id,date,time,type,regular){

 let data={time:time,type:type};

 if(regular){
   let weekday=new Date(date+"T12:00:00").getDay();
   localStorage.setItem(
     regularKey(id,weekday),
     JSON.stringify(data)
   );
 }else{
   localStorage.setItem(
     planKey(id,date),
     JSON.stringify(data)
   );
 }

 render();
}

function clearPlan(id,date){
 localStorage.removeItem(planKey(id,date));
 render();
}

function formatDate(date){
 return new Date(date+"T12:00:00")
 .toLocaleDateString("de-DE",{
   weekday:"long",
   day:"2-digit",
   month:"2-digit",
   year:"numeric"
 });
}

function render(){

 document.getElementById("date").textContent=
   new Date().toLocaleDateString("de-DE",{
     weekday:"long",
     day:"2-digit",
     month:"2-digit",
     year:"numeric"
   });

 renderToday();
 renderAll();
 renderWeek();
 renderGoing();
}

function renderToday(){

 let el=document.getElementById("today");

 el.innerHTML=
 "<div class='card'><h2>Wer ist heute da?</h2>";

 children.forEach(c=>{

   let d=getActual(c.id);

   el.innerHTML+=`
   <div class="child ${c.color}">
     <div>
       <strong>${c.name}</strong>
       <div class="small">${c.className}</div>
     </div>

     <button onclick="saveActual(${c.id},'come')">
       Ankommen<br>
       <span class="time">${d.come||"–"}</span>
     </button>

     <button onclick="saveActual(${c.id},'go')">
       Gehen<br>
       <span class="time">${d.go||"–"}</span>
     </button>
   </div>`;
 });

 el.innerHTML+="</div>";
}

function renderAll(){

 let el=document.getElementById("all");

 el.innerHTML=
 "<div class='card'><h2>Alle 67 Kinder</h2>";

 children.forEach(c=>{
   el.innerHTML+=`
   <div class="child ${c.color}">
     <div>
       <strong>${c.name}</strong>
       <div class="small">${c.className}</div>
     </div>
     <div></div>
     <div></div>
   </div>`;
 });

 el.innerHTML+="</div>";
}

function renderWeek(){

 let el=document.getElementById("week");

 let date=dateKey(selectedDate);

 el.innerHTML=`
 <div class="card">
   <h2>Wochenplanung</h2>

   <div class="controls">
     <button onclick="changeDay(-1)">◀</button>
     <button class="active">${formatDate(date)}</button>
     <button onclick="changeDay(1)">▶</button>
   </div>

   <p class="small">
     Grau = regelmäßige Planung. Gelb = kurzfristige Änderung.
   </p>
 `;

 classes.forEach(c=>{

   el.innerHTML+=`
   <h3>${c[0]}</h3>
   <div>`;

   children
   .filter(x=>x.className===c[0])
   .forEach(child=>{

     let p=getPlan(child.id,date);

     let regular=false;
     let weekday=new Date(date+"T12:00:00").getDay();

     if(
       localStorage.getItem(regularKey(child.id,weekday)) &&
       !localStorage.getItem(planKey(child.id,date))
     ){
       regular=true;
     }

     let options=
       `<option value="">keine Planung</option>`+
       times.map(t=>
         `<option value="${t}" ${p.time===t?"selected":""}>${t}</option>`
       ).join("");

     let typeOptions=types.map(t=>
       `<option value="${t[0]}" ${p.type===t[0]?"selected":""}>${t[1]}</option>`
     ).join("");

     el.innerHTML+=`
     <div class="planrow ${!regular&&p.time?"override":""}">
       <div>
         <strong>${child.name}</strong>
         ${regular?
           "<div class='planned-label'>regelmäßig</div>":
           p.time?"<div class='planned-label'>diese Woche</div>":""
         }
       </div>

       <select
         onchange="changePlan(${child.id},'${date}',this.value,'time')">
         ${options}
       </select>

       <select
         onchange="changePlan(${child.id},'${date}',this.value,'type')">
         ${typeOptions}
       </select>
     </div>`;
   });

   el.innerHTML+=`</div>`;
 });

 el.innerHTML+="</div>";
}

function changePlan(id,date,value,field){

 let p=getPlan(id,date);

 if(field==="time") p.time=value;
 if(field==="type") p.type=value;

 localStorage.setItem(
   planKey(id,date),
   JSON.stringify(p)
 );

 render();
}

function changeDay(amount){

 selectedDate.setDate(
   selectedDate.getDate()+amount
 );

 render();
}

function setRegularFromCurrent(id,date){

 let p=getPlan(id,date);

 if(!p.time && !p.type){
   alert("Bitte zuerst Zeit oder Art auswählen.");
   return;
 }

 let weekday=new Date(date+"T12:00:00").getDay();

 localStorage.setItem(
   regularKey(id,weekday),
   JSON.stringify(p)
 );

 render();
}

function renderGoing(){

 let el=document.getElementById("going");
 let date=todayKey();

 let list=[];

 children.forEach(c=>{
   let p=getPlan(c.id,date);

   if(p.time){
     list.push({
       child:c,
       plan:p
     });
   }
 });

 list.sort((a,b)=>
   a.plan.time.localeCompare(b.plan.time)
 );

 el.innerHTML=
 "<div class='card'><h2>Wer geht heute?</h2>";

 if(!list.length){
   el.innerHTML+=
   "<p>Für heute sind noch keine geplanten Zeiten eingetragen.</p>";
 }

 list.forEach(x=>{
   el.innerHTML+=`
   <div class="child ${x.child.color}">
     <div>
       <strong>${x.child.name}</strong>
       <div class="small">${x.child.className}</div>
     </div>
     <div class="time planned">${x.plan.time}</div>
     <div class="time planned">${x.plan.type||"—"}</div>
   </div>`;
 });

 el.innerHTML+="</div>";
}

function showPage(id,btn){

 document.querySelectorAll("main section")
 .forEach(s=>s.classList.add("hidden"));

 document.getElementById(id)
 .classList.remove("hidden");

 document.querySelectorAll("nav button")
 .forEach(b=>b.classList.remove("active"));

 btn.classList.add("active");

 render();
}

if("serviceWorker" in navigator){
 navigator.serviceWorker.register("sw.js");
}

render();

</script>

</body>
</html>
