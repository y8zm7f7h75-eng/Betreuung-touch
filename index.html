<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Betreuung – Touch-Tabelle</title>

<link rel="manifest" href="manifest.webmanifest">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f8;
  color:#263238;
}

header{
  background:#6b8e9e;
  color:white;
  padding:14px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

nav{
  display:flex;
  gap:6px;
  padding:8px;
  background:white;
  position:sticky;
  top:0;
  z-index:10;
  overflow-x:auto;
}

nav button{
  flex:1;
  min-width:110px;
  padding:14px 8px;
  border:0;
  border-radius:10px;
  background:#dce5e9;
  font-size:16px;
}

nav button.active{
  background:#6b8e9e;
  color:white;
}

main{
  padding:12px;
  max-width:1000px;
  margin:auto;
}

h2{
  margin-top:8px;
}

.section{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:14px;
  box-shadow:0 1px 4px #0001;
}

.datebar{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

input[type=date]{
  font-size:18px;
  padding:10px;
  border-radius:9px;
  border:1px solid #bbb;
}
input[type=time]{
  font-size:18px;
  padding:10px;
  border-radius:9px;
  border:1px solid #bbb;
}
button{
  cursor:pointer;
}

.smallbtn{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  background:#dce5e9;
  font-size:15px;
}
.today-class-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:10px 0 14px;
}

.today-class-buttons .smallbtn.active-class{
  background:#6b8e9e;
  color:white;
}
.child{
  background:#fafafa;
  border-left:7px solid #ccc;
  border-radius:10px;
  padding:10px;
  margin:8px 0;
}

.childtitle{
  font-weight:bold;
  margin-bottom:8px;
}

.controls{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  align-items:center;
}

select{
  font-size:17px;
  padding:9px;
  border-radius:8px;
  border:1px solid #bbb;
  background:white;
}

.planned{
  background:#fff4b8;
}

.exception{
  border:3px solid #e67e22;
background:#fff0e0;
}

.regular-row{
  display:grid;
  grid-template-columns:120px repeat(5,1fr);
  gap:6px;
  align-items:center;
  margin:5px 0;
}

.regular-row select{
  width:100%;
  font-size:14px;
  padding:7px;
}

.regular-head{
  display:grid;
  grid-template-columns:120px repeat(5,1fr);
  gap:6px;
  font-weight:bold;
  margin-bottom:5px;
}

.daybox{
  background:#f5f7f8;
  border-radius:8px;
  padding:4px;
}

.going{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px;
  border-radius:9px;
  margin:5px 0;
}
  .going-time-separator{
  border-top:2px solid #9aaeb6;
  margin:12px 0;
}
.going-info{

  font-size:14px;

  color:#555;

  margin-left:8px;
}
.time{
  font-size:21px;
  font-weight:bold;
  min-width:65px;
}

.type{
  font-size:17px;
}

.classname{
  font-size:12px;
  opacity:.7;
}

.notice{
  background:#eef5f7;
  padding:10px;
  border-radius:9px;
  margin:8px 0;
}

@media(max-width:700px){
  .regular-row,
  .regular-head{
    grid-template-columns:80px repeat(5,1fr);
  }

  .regular-row select{
    font-size:12px;
  }
}
.week-controls{
  margin:12px 0 18px;
}

.week-controls input{
  font-size:18px;
  padding:8px;
  margin-left:8px;
}

.weekly-title{
  font-size:22px;
  font-weight:700;
  margin-bottom:2px;
}

.weekly-subtitle{
  font-size:16px;
  margin-bottom:12px;
}

.weekly-table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  font-size:13px;
}

.weekly-table th,
.weekly-table td{
  padding:4px 3px;
  text-align:center;
  border-bottom:1px solid #d8d8d8;
}

.weekly-table .child-col{
  width:24%;
  text-align:left;
}

.weekly-table .day-col{
  font-weight:700;
}
.day-holiday{
  font-size:10px;
  font-weight:700;
  margin-top:3px;
}
.weekly-table .day-col span{
  font-weight:400;
  font-size:11px;
}

.weekly-table .child-name{
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
}

.weekly-table .day-start{
  border-left:2px solid #777;
}

.weekly-table .subhead th{
  font-size:11px;
  font-weight:600;
}

.weekly-table .class-row{
  break-after:avoid;
  page-break-after:avoid;
}
  
  .weekly-table .class-row td{
  text-align:left;
  font-weight:700;
  padding-top:8px;
  padding-bottom:3px;
  border-bottom:1px solid #999;
}

@media print{

  body{
    background:white;
  }

  .app-header,
  nav,
  .week-controls,
  #heute,
  #alle,
  #wochenplanung,
  #wergeht{
    display:none !important;
  }

  #wochenuebersicht{
    display:block !important;
  }

  .weekly-title{
    display:block !important;
    font-size:12px !important;
    margin:0 0 2px 0 !important;
  }

  .weekly-subtitle{
    display:block !important;
    font-size:10px !important;
    margin:0 0 5px 0 !important;
  }

  .weekly-table{
    font-size:8px !important;
    margin:0 !important;
  } 
  
  .weekly-page-break{
   display:block important;
    break-bevore:page !important;
    page-break-bevore:always !important;
    high:0 !important;
  }
  .weekly-second-table{
    break-before:page !important;
    page-break-before:always !important;
  }
  .weekly-table .print-page-break{
    break-befor:page;
    page-break-before:always;
  }

  .weekly-table th,
  .weekly-table td{
    padding:2px !important;
  }

  @page{
    size:A4 portrait;
    margin:2mm;
  }
}
</style>
</head>

<body>

<header class="app-header" id="appHeader">Betreuung – Touch-Tabelle</header>

<nav>
  <button id="tab-heute" onclick="showTab('heute')">Heute</button>
  <button id="tab-alle" onclick="showTab('alle')">Alle Kinder</button>
  <button id="tab-woche" onclick="showTab('woche')">Wochenplanung</button>
  <button id="tab-geht" onclick="showTab('geht')">Wer geht wann?</button>
<button id="tab-wochenuebersicht" class="tab" onclick="showTab('wochenuebersicht')">Wochenübersicht</button>
<button id="tab-flex" class="tab" onclick="showTab('flex')">Flex-Kinder</button>
</nav>
<main>
<section id="wochenuebersicht" class="view">
  <h2>Wochenübersicht</h2>

    <div class="week-controls">

    <label>
      Woche:
      <input
        type="date"
        id="weekPicker"
        onchange="renderWeeklyOverview()"
      >
    </label>

    <br><br>

    <label>
      Tag schließen:
      <input
        type="date"
        id="closedDate"
      >
    </label>

    <input
      type="text"
      id="closedReason"
      placeholder="Grund, z. B. Fortbildung"
    >

    <button
      class="smallbtn"
      onclick="closeDay(
        document.getElementById('closedDate').value,
        document.getElementById('closedReason').value
      )">
      Tag schließen
    </button>

  </div>

  <div id="weeklyOverview"></div>
</section>
<section id="heute" class="view">

  <h2>Heute - <span id="heuteDatum"></span></h2>

  <div class="today-class-buttons">

    <button class="smallbtn active-class"
      onclick="showTodayClass(1)">
      Klasse 1
    </button>

    <button class="smallbtn"
      onclick="showTodayClass(2)">
      Klasse 2
    </button>

    <button class="smallbtn"
      onclick="showTodayClass(3)">
      Klasse 3
    </button>

    <button class="smallbtn"
      onclick="showTodayClass(4)">
      Klasse 4
    </button>

  </div>

  <div id="todayList"></div>

</section>

<section id="alle" class="view" style="display:none">

  <h2>Alle Kinder</h2>

  <div id="allList"></div>

  <div class="section">

    <h3>Verwaltung / Notizen</h3>

    <label>Kind auswählen</label>

    <select id="childManagementSelect"
            onchange="selectChildManagement(this.value)">
      <option value="">Bitte Kind auswählen</option>
    </select>

    <div id="childManagement"></div>

  </div>

</section>

<section id="woche" class="view" style="display:none">

  <h2>Wochenplanung</h2>

 <div class="section">
    <div class="datebar">
      <strong>Datum:</strong>
      <input type="date" id="selectedDate" onchange="renderDailyPlan()">
      <button class="smallbtn" onclick="goToday()">Tagesplanung</button>
      <button class="smallbtn" onclick="showRegular()">Regelmäßige Woche</button>
    </div>

    <div id="dateInfo" class="notice"></div>
  </div>

  <div id="dailyPlanning"></div>

  <div id="regularPlanning" style="display:none"></div>

</section>

<section id="geht" class="view" style="display:none">
  <h2>Wer geht heute?</h2>
  <div id="goingList"></div>
</section>
<section id="flex" class="view" style="display:none">
  <h2>Flex-Kinder</h2>
  <div id="flexList"></div>
</section>
</main>

<script>

const classes = [
  ["Klasse 1 Affen","blau",9],
  ["Klasse 1 Zebra","blau",6],
  ["Klasse 2 Affen","grün",11],
  ["Klasse 2 Zebra","grün",13],
  ["Klasse 3","gelb",12],
  ["Klasse 4","rot",16]
];
let childClassOverrides=load("childClassOverrides",{});

const children=[];
let number=1;

classes.forEach(c=>{
  for(let i=0;i<c[2];i++){
    children.push({
      id:"kind"+number,
      name:"Kind "+number,
      className:childClassOverrides["kind"+number] || c[0],
      color:c[1]
    });
    number++;
  }
});
const flexChildren=["kind1"];
const times=[
  "",
  "11:00",
  "12:00",
  "12:45",
  "13:00",
  "13:10",
  "13:45",
  "14:00",
  "14:30",
  "14:35",
  "15:00",
  "15:30",
  "16:00"
];

const types=["","B","Pp","T","M","Abh","Anr","G","—"];

const weekdayNames=[
  "Sonntag",
  "Montag",
  "Dienstag",
  "Mittwoch",
  "Donnerstag",
  "Freitag",
  "Samstag"
];
/* -------------------------
   FERIEN UND FEIERTAGE NRW
------------------------- */

const nrwFerien = [
  {
    von:"2026-10-17",
    bis:"2026-10-31",
    name:"Herbstferien"
  },
  {
    von:"2026-12-23",
    bis:"2027-01-06",
    name:"Weihnachtsferien"
  },
  {
    von:"2027-03-22",
    bis:"2027-04-03",
    name:"Osterferien"
  },
  {
    von:"2027-05-18",
    bis:"2027-05-18",
    name:"Pfingstferien"
  },
  {
    von:"2027-07-19",
    bis:"2027-08-31",
    name:"Sommerferien"
  }
];


function getFerien(date){

  return nrwFerien.find(f =>
    date >= f.von && date <= f.bis
  ) || null;

}
  const nrwFeiertage = {
  "2027-05-06":"Christi Himmelfahrt",
  "2027-05-17":"Pfingstmontag",
  "2027-05-27":"Fronleichnam"
};

function getFeiertag(date){

  return nrwFeiertage[date] || "";

}
/* -------------------------
   SPEICHER
------------------------- */

function load(key, fallback){
  try{
    const x=localStorage.getItem(key);
    return x ? JSON.parse(x) : fallback;
  }catch(e){
    return fallback;
  }
}

function save(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}
function closeDay(date,reason){

  if(!date) return;

  if(!confirm("Soll dieser Tag wirklich geschlossen werden?")){
    return;
  }

  closedDays[date]=reason || "Schule geschlossen";

  save("closedDays",closedDays);

  renderWeeklyOverview();

}
  function reopenDay(date){

  if(!date) return;

  if(!confirm("Soll die Schließung dieses Tages wirklich aufgehoben werden?")){
    return;
  }

  delete closedDays[date];

  save("closedDays",closedDays);

  renderWeeklyOverview();
}
let attendance=load("attendance",{});
let dailyPlans=load("dailyPlans",{});
let regularPlans=load("regularPlans",{});
let closedDays=load("closedDays",{});


/*
  Falls eine ältere Version bereits "actuals" benutzt hat,
  werden die Daten übernommen.
*/
if(Object.keys(attendance).length===0){
  const old=load("actuals",{});
  if(Object.keys(old).length){
    attendance=old;
    save("attendance",attendance);
  }
}

/* -------------------------
   HILFSFUNKTIONEN
------------------------- */

function todayString(){
  const d=new Date();
  return d.toISOString().slice(0,10);
}

function formatDate(date){
  const d=new Date(date+"T12:00:00");
  return d.toLocaleDateString("de-DE",{
    weekday:"long",
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}

function weekday(date){
  return new Date(date+"T12:00:00").getDay();
}

function childColor(c){
  const map={
    blau:"#8faec0",
    grün:"#9dbb9d",
    gelb:"#d5bd67",
    rot:"#c98f8f"
  };
  return map[c.color] || "#ccc";
}

function options(list,selected){
  return list.map(x=>{
    const value=x;
    const text=x || "keine Planung";
    return `<option value="${value}" ${value===selected?"selected":""}>${text}</option>`;
  }).join("");
}

function typeOptions(selected){
  return types.map(x=>{
    const text=x || "–";
    return `<option value="${x}" ${x===selected?"selected":""}>${text}</option>`;
  }).join("");
}

/* -------------------------
   PLANUNG ERMITTELN
------------------------- */

function getRegularPlan(childId,date){
  const wd=weekday(date);

  if(wd===0 || wd===6) return {
    time:"",
    type:""
  };

  return (
    regularPlans[childId] &&
    regularPlans[childId][wd]
  ) || {
    time:"",
    type:""
  };
}

function getPlan(childId,date){
  if(
    dailyPlans[date] &&
    dailyPlans[date][childId]
  ){
    return {
      ...dailyPlans[date][childId],
      exception:true
    };
  }

  return {
    ...getRegularPlan(childId,date),
    exception:false
  };
}

/* -------------------------
   TABS
------------------------- */

function showTab(tab){

  document.querySelectorAll(".view").forEach(x=>{
    x.style.display="none";
  });

  document.querySelectorAll("nav button").forEach(x=>{
    x.classList.remove("active");
  });

  document.getElementById(tab).style.display="block";
  document.getElementById("tab-"+tab).classList.add("active");
  if(tab==="wochenuebersicht"){
  document.getElementById("wochenuebersicht").style.display="block";
  renderWeeklyOverview();
}
  if(tab==="heute") renderToday();
  if(tab==="alle") renderAll();
  if(tab==="woche") renderDailyPlan();
  if(tab==="geht") renderGoing();
  if(tab==="flex") renderFlex();
  if(tab==="wochenuebersicht"){const p=document.getElementById("weekPicker");if(p&&!p.value)p.value=todayString();renderWeeklyOverview()
  }
}
/* -------------------------
   HEUTE
------------------------- */
let todayClass=1;

function showTodayClass(classNumber){

  todayClass=classNumber;

  document.querySelectorAll(".today-class-buttons button").forEach((button,i)=>{

    button.classList.toggle(
      "active-class",
      i+1===classNumber
    );

  });

  renderToday(todayClass);

}
  function renderToday(classNumber=1){

  const date=todayString();

  document.getElementById("heuteDatum").textContent =
    shortDate(date);

  let html="";

  let selectedClasses=[];

  if(classNumber===1){
    selectedClasses=[
      "Klasse 1 Affen",
      "Klasse 1 Zebra"
    ];
  }

  if(classNumber===2){
    selectedClasses=[
      "Klasse 2 Affen",
      "Klasse 2 Zebra"
    ];
  }

  if(classNumber===3){
    selectedClasses=[
      "Klasse 3"
    ];
  }

  if(classNumber===4){
    selectedClasses=[
      "Klasse 4"
    ];
  }

  selectedClasses.forEach(className=>{

    html+=`
      <div class="section">

        <h3>${className}</h3>
    `;

    children
      .filter(c=>c.className===className)
      .forEach(c=>{

        const a=attendance[date]?.[c.id] || {};

        html+=`
          <div class="child"
               style="border-left-color:${childColor(c)}">

            <div class="childtitle">
              ${c.name}
              <span class="classname">${c.className}</span>
            </div>

            <div class="controls">

              <button class="smallbtn"
                onclick="setArrival('${c.id}')">
                ${a.ankommen
                  ? "Ankommen "+a.ankommen
                  : "Ankommen"}
              </button>

              <button class="smallbtn"
                onclick="setDeparture('${c.id}')">
                ${a.gehen
                  ? "Gehen "+a.gehen
                  : "Gehen"}
              </button>

              <input
                type="time"
                value="${a.gehen || ""}"
                onchange="changeDeparture('${c.id}',this.value)"
                title="Gehzeit eintragen oder korrigieren">

            </div>

          </div>
        `;

      });

    html+=`
      </div>
    `;

  });

  document.getElementById("todayList").innerHTML=html;

}

function currentTime(){
  return new Date().toLocaleTimeString("de-DE",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function setArrival(id){

  const date=todayString();

  if(!attendance[date]) attendance[date]={};

  attendance[date][id]=attendance[date][id] || {};

  attendance[date][id].ankommen=currentTime();

  save("attendance",attendance);

  renderToday(todayClass);
}

function setDeparture(id){

  const date=todayString();

  if(!attendance[date]) attendance[date]={};

  attendance[date][id]=attendance[date][id] || {};

  attendance[date][id].gehen=currentTime();

  save("attendance",attendance);

  renderToday(todayClass);

}


function changeDeparture(id,time){

  const date=todayString();

  if(!attendance[date]) attendance[date]={};

  attendance[date][id]=attendance[date][id] || {};

  attendance[date][id].gehen=time;

  save("attendance",attendance);

  renderToday(todayClass);

}

/* -------------------------
   ALLE KINDER
------------------------- */

function renderAll(){

  let html="";

  classes.forEach(c=>{

    html+=`
      <div class="section">
        <h3>${c[0]}</h3>
    `;

    children
      .filter(x=>x.className===c[0])
      .forEach(x=>{
        html+=`
          <div>${x.name}</div>
        `;
      });

    html+="</div>";
  });

  document.getElementById("allList").innerHTML=html;


  /* Kinderauswahl für Verwaltung / Notizen */

  const select=document.getElementById("childManagementSelect");

  if(select){

    select.innerHTML=
      `<option value="">Bitte Kind auswählen</option>`;

    children.forEach(c=>{

      const option=document.createElement("option");

      option.value=c.id;
      option.textContent=c.name;

      select.appendChild(option);

    });

  }

}
  function selectChildManagement(id){

  const box=document.getElementById("childManagement");

  if(!id){

    box.innerHTML="";

    return;
  }

  const child=children.find(c=>c.id===id);

  if(!child) return;

  box.innerHTML=`

    <div class="section">

      <h3>${child.name}</h3>

      <p>
        Klasse: <strong>${child.className}</strong>
      </p>

      <div class="controls">

        <input
          type="text"
          id="childNoteInput"
          placeholder="z. B. Projekt bezahlt">

        <button
          class="smallbtn"
          onclick="addChildNote('${child.id}')">
          Eintrag speichern
        </button>

      </div>

      <div id="childNotes"></div>

    </div>

  `;

  renderChildNotes(child.id);

}
  function addChildNote(id){

  const input=document.getElementById("childNoteInput");

  if(!input) return;

  const text=input.value.trim();

  if(!text) return;

  const date=todayString();

  const notes=load("childNotes",{});

  if(!notes[id]){
    notes[id]=[];
  }

  notes[id].push({
    date:date,
    text:text
  });

  save("childNotes",notes);

  input.value="";

  renderChildNotes(id);

}
  function renderChildNotes(id){

  const box=document.getElementById("childNotes");

  if(!box) return;

  const notes=load("childNotes",{});

  const list=notes[id] || [];

  if(!list.length){

    box.innerHTML=`
      <p>Noch keine Einträge vorhanden.</p>
    `;

    return;
  }

  let html="";

  list.slice().reverse().forEach((entry,index)=>{

    html+=`
      <div class="section">

        <strong>${shortDate(entry.date)}</strong>

        <div>
          ${entry.text}
        </div>

      </div>
    `;

  });

  box.innerHTML=html;

}
/* -------------------------
   DATUM
------------------------- */

function goToday(){
  document.getElementById("selectedDate").value=todayString();
  renderDailyPlan();
}

/* -------------------------
   TAGESPLANUNG
------------------------- */

function renderDailyPlan(){

  const date=
    document.getElementById("selectedDate").value ||
    todayString();

  document.getElementById("selectedDate").value=date;

  document.getElementById("regularPlanning").style.display="none";
  document.getElementById("dailyPlanning").style.display="block";

  document.getElementById("dateInfo").innerHTML=
    `<strong>${formatDate(date)}</strong>
     – Tippe hier die Planung für genau diesen Tag ein.`;

  let html="";

  function changeDailyPlan(date,id,time,type,info){

  if(!dailyPlans[date]){

    dailyPlans[date]={};

  }

  const old=dailyPlans[date][id] || getRegularPlan(id,date);

  dailyPlans[date][id]={

    time:time===null ? old.time : time,

    type:type===null ? old.type : type,

     info:info===undefined ? (old.info || "") : info

  };

  save("dailyPlans",dailyPlans);

  renderDailyPlan();
}
  function useRegular(date,id){

  if(dailyPlans[date] && dailyPlans[date][id]){

    delete dailyPlans[date][id];

  }

  if(

    dailyPlans[date] &&

    Object.keys(dailyPlans[date]).length===0

  ){

    delete dailyPlans[date];

  }

  save("dailyPlans",dailyPlans);

  renderDailyPlan();

}

function showRegular(){

  document.getElementById("dailyPlanning").style.display="none";
  document.getElementById("regularPlanning").style.display="block";

  let html=`
    <div class="section">

      <h2>Regelmäßige Woche</h2>

        entsprechenden Wochentage. Eine einzelne Tagesplanung

      </div>

      <div class="regular-head">
        <div>Kind</div>
        <div>Mo</div>
        <div>Di</div>
        <div>Mi</div>
        <div>Do</div>
        <div>Fr</div>
      </div>
  `;

  classes.forEach(cls=>{

    html+=`<h3>${cls[0]}</h3>`;

    children
      .filter(c=>c.className===cls[0])
      .forEach(c=>{

        html+=`
          <div class="regular-row">

            <div>
              <strong>${c.name}</strong>
            </div>
        `;

        for(let wd=1;wd<=5;wd++){

          const p=
            regularPlans[c.id]?.[wd] ||
            {time:"",type:""};

          html+=`
            <div class="daybox">

              <select
                onchange="changeRegular('${c.id}',${wd},'time',this.value)">
                ${options(times,p.time)}
              </select>

              <select
                onchange="changeRegular('${c.id}',${wd},'type',this.value)">
                ${typeOptions(p.type)}
              </select>

            </div>
          `;
        }

        html+="</div>";
      });
  });

  html+=`
      </div>
  `;

  document.getElementById("regularPlanning").innerHTML=html;
}

function changeRegular(id,wd,field,value){

  if(!regularPlans[id]){
    regularPlans[id]={};
  }

  if(!regularPlans[id][wd]){
    regularPlans[id][wd]={
      time:"",
      type:""
    };
  }

  regularPlans[id][wd][field]=value;

  save("regularPlans",regularPlans);
}

  const date=todayString();

      list.push({
        child:c,

        info:p.info || ""
      });

  );

  if(!list.length){

    document.getElementById("goingList").innerHTML=

    return;

  let html="";

function mondayOf(dateString){
  const d=new Date(dateString+"T12:00:00");
  const day=d.getDay();
  const diff=day===0 ? -6 : 1-day;
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}

function addDays(dateString,days){
  const d=new Date(dateString+"T12:00:00");
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}

function shortDate(dateString){
  const d=new Date(dateString+"T12:00:00");
  return d.toLocaleDateString("de-DE",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}
