<!doctype html>

<html lang="de">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#6b8e9e">

<title>Betreuung – Touch-Tabelle</title>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:Arial,sans-serif;background:#f4f7f8;color:#263238}

header{background:#6b8e9e;color:white;padding:18px;text-align:center}

h1{margin:0;font-size:28px}

nav{display:flex;gap:8px;padding:10px;background:white;position:sticky;top:0;z-index:2}

button{border:0;border-radius:12px;padding:14px 18px;font-size:18px;cursor:pointer}

nav button{flex:1;background:#dce7eb}

nav button.active{background:#6b8e9e;color:white}

main{padding:14px;max-width:1100px;margin:auto}

.card{background:white;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}

.child{display:grid;grid-template-columns:1fr 150px 150px;gap:10px;align-items:center;padding:10px;border-radius:12px;margin:6px 0}

.child button{background:#e8eef0}

.time{font-size:20px;font-weight:bold;text-align:center}

.planned{color:#8b8b8b}

.class1{border-left:12px solid #7aa7d9}

.class2{border-left:12px solid #75b77a}

.class3{border-left:12px solid #e2c34f}

.class4{border-left:12px solid #d96b62}

.small{font-size:14px;color:#667}

.hidden{display:none}

@media(max-width:700px){

.child{grid-template-columns:1fr 105px 105px}

.child button{padding:12px 5px;font-size:15px}

}

</style>

</head>

<body>

<header>

<h1>Betreuung – Touch-Tabelle</h1>

<div id="date"></div>

</header>

<nav>

<button class="active" onclick="showPage('today',this)">Heute</button>

<button onclick="showPage('all',this)">Alle Kinder</button>

<button onclick="showPage('week',this)">Wochenplanung</button>

</nav>

<main>

<section id="today"></section>

<section id="all" class="hidden"></section>

<section id="week" class="hidden"></section>

</main>

<script>

const classes=[

["Klasse 1 Affen","class1",9],

["Klasse 1 Zebra","class1",6],

["Klasse 2 Affen","class2",11],

["Klasse 2 Zebra","class2",13],

["Klasse 3","class3",12],

["Klasse 4","class4",16]

];

const children=[];

let n=1;

classes.forEach(c=>{

 for(let i=1;i<=c[2];i++)

  children.push({id:n++,name:"Kind "+n,className:c[0],color:c[1]});

});

function key(id){return "kind_"+id+"_"+new Date().toISOString().slice(0,10)}

function now(){

 return new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});

}

function save(id,type){

 let data=JSON.parse(localStorage.getItem(key(id))||"{}");

 data[type]=now();

 localStorage.setItem(key(id),JSON.stringify(data));

 render();

}

function render(){

 document.getElementById("date").textContent=

   new Date().toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});

 renderToday();

 renderAll();

 renderWeek();

}

function renderToday(){

 let el=document.getElementById("today");

 el.innerHTML="<div class='card'><h2>Wer ist heute da?</h2>";

 children.forEach(c=>{

   let d=JSON.parse(localStorage.getItem(key(c.id))||"{}");

   el.innerHTML+=`

   <div class="child ${c.color}">

     <div><strong>${c.name}</strong><div class="small">${c.className}</div></div>

     <button onclick="save(${c.id},'come')">Ankommen<br><span class="time">${d.come||"–"}</span></button>

     <button onclick="save(${c.id},'go')">Gehen<br><span class="time">${d.go||"–"}</span></button>

   </div>`;

 });

 el.innerHTML+="</div>";

}

function renderAll(){

 let el=document.getElementById("all");

 el.innerHTML="<div class='card'><h2>Alle 67 Kinder</h2>";

 children.forEach(c=>{

   el.innerHTML+=`<div class="child ${c.color}">

   <div><strong>${c.name}</strong><div class="small">${c.className}</div></div>

   <div></div><div></div></div>`;

 });

 el.innerHTML+="</div>";

}

function renderWeek(){

 let el=document.getElementById("week");

 el.innerHTML="<div class='card'><h2>Wochenplanung</h2><p>Die ausführliche Planung wird als nächster Schritt ergänzt.</p></div>";

}

function showPage(id,btn){

 document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));

 document.getElementById(id).classList.remove("hidden");

 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));

 btn.classList.add("active");

}

render();

</script>

</body>

</html>
